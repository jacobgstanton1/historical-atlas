<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#11161b" />
  <title>Historical Atlas</title>
  <link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAzMiAzMiI+PHJlY3Qgd2lkdGg9IjMyIiBoZWlnaHQ9IjMyIiByeD0iNCIgZmlsbD0iIzExMTYxYiIvPjxwYXRoIGQ9Im04IDI0IDgtMTcgOCAxN00xMSAxOWgxMCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjZjRmNWYzIiBzdHJva2Utd2lkdGg9IjIiLz48L3N2Zz4=" />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./styles.css?v=visual-polish1" />
</head>
<body>
  <main id="app" class="app-shell">
    <section class="map-stage" aria-label="Historical world map">
      <div id="map"></div>

      <header class="topbar">
        <div class="brand">
          <div class="brand-title">Historical Atlas</div>
          <div id="status" class="brand-status">Starting map…</div>
        </div>

        <div class="search-wrap">
          <input id="search" class="search-input" type="search" autocomplete="off" placeholder="Search territory…" aria-label="Search territory" />
          <div id="search-results" class="search-results" hidden></div>
        </div>

        <div class="top-actions">
          <button id="labels-toggle" class="ui-button" type="button" aria-pressed="true" title="Toggle map labels" aria-label="Toggle map labels"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5h16M12 5v14M8 19h8"/></svg><span class="control-text">Labels</span></button>
          <button id="reset-view" class="ui-button" type="button" title="Reset world view" aria-label="Reset world view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg><span class="control-text">Reset</span></button>
        </div>
      </header>

      <div id="loading-indicator" class="loading-indicator" hidden aria-live="polite">
        <span class="loading-spinner" aria-hidden="true"></span>
        <span id="loading-text">Loading historical boundaries…</span>
      </div>

      <aside id="inspector" class="inspector" aria-label="Historical Territory Dossier" aria-hidden="true" inert>
        <button id="close-inspector" class="inspector-close" type="button" aria-label="Close historical territory dossier" title="Close dossier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        <div id="dossier-content"></div>
      </aside>

      <section class="timeline-shell" aria-label="Historical timeline">
        <div class="timeline-controls">
          <button id="previous-year" class="timeline-button" type="button" aria-label="Previous available snapshot" title="Previous snapshot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m14 6-6 6 6 6"/></svg></button>
          <button id="play" class="timeline-button play-button" type="button" aria-label="Play timeline" title="Play timeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path class="play-symbol" d="m9 5 11 7-11 7Z"/><path class="pause-symbol" d="M8 5v14M16 5v14"/></svg></button>

          <div class="timeline-main">
            <div class="timeline-heading">
              <div>
                <strong id="year-label">1938 CE</strong>
                <span id="snapshot-note" class="snapshot-note">Exact boundary snapshot</span>
              </div>
            </div>

            <div class="timeline-track-wrap">
              <input id="timeline" type="range" min="1800" max="1960" step="1" value="1938" aria-label="Historical year" />
              <div id="snapshot-marks" class="snapshot-marks" aria-label="Available boundary snapshots"></div>
            </div>

            <div class="timeline-footer">
              <span>1800</span>
              <form id="year-form" class="year-form">
                <label for="year-jump">Jump to year</label>
                <input id="year-jump" type="number" min="1800" max="1960" inputmode="numeric" value="1938" aria-label="Jump to year" />
                <button type="submit">Go</button>
              </form>
              <span>1960</span>
            </div>
          </div>

          <button id="next-year" class="timeline-button" type="button" aria-label="Next available snapshot" title="Next snapshot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m10 6 6 6-6 6"/></svg></button>
        </div>
      </section>

      <div class="source-credit">Historical boundaries: Historical Basemaps · v0.6.1</div>
    </section>
  </main>

  <script type="module" src="./app.js?v=visual-polish1"></script>
</body>
</html>
