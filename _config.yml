# The atlas is a static application. Internal research is not site content.
encoding: utf-8
exclude:
  - research
  - development
  - scripts
  - tests
  - README.md
  - "**/README.md"
  - node_modules
  - package.json
  - package-lock.json
  - .sass-cache
  - .jekyll-cache
  - gemfiles
  - Gemfile
  - Gemfile.lock
  - vendor
